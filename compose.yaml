services:
  app:
    build: .
    image: ${IMAGE:-app:local}
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    restart: unless-stopped

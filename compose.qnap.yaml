# QNAP Container Station: pulls the published image (no local build)
services:
  app:
    image: ${IMAGE:?set IMAGE in .env}
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ${QNAP_DATA_DIR:-/share/Container/app/data}:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

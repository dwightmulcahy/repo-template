name: CI

on:
  push:
    branches: ["**"]          # branches only; tags are handled by release.yml
  pull_request:
  workflow_call:              # reused by release.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"
  IMAGE: app:ci
  PORT: "8080"

jobs:
  syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: node --check all .js/.mjs
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z -- '*.js' '*.mjs')
          [ ${#files[@]} -eq 0 ] && { echo "No JS files"; exit 0; }
          for f in "${files[@]}"; do node --check "$f"; done
          echo "Checked ${#files[@]} files"

  compose:
    name: Validate Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.qnap.yaml config --quiet

  build:
    name: Build web + offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run build:offline
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker-smoke:
    name: Docker image + Chromium smoke
    runs-on: ubuntu-latest
    needs: [syntax, build]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start hardened container
        run: |
          docker run -d --name app -p ${PORT}:8080 \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 200 --memory 256m \
            "$IMAGE"
      - name: Check /health
        run: |
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:${PORT}/health" && exit 0
            sleep 1
          done
          echo "::error::/health never became ready"; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: http://localhost:${{ env.PORT }}
      - name: Container logs
        if: failure()
        run: docker logs app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

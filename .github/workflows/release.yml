name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never abort a half-published release

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # Set repo variable DOCKERHUB_REPO (e.g. myuser/myapp); falls back to <username>/<repo-name>
  IMAGE: docker.io/${{ vars.DOCKERHUB_REPO || format('{0}/{1}', vars.DOCKERHUB_USERNAME, github.event.repository.name) }}

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tagged commit must be reachable from origin/main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1
          fi
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=true || pre=false
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  validate:
    name: Full validation suite
    needs: verify
    uses: ./.github/workflows/ci.yml

  docker:
    name: Publish multi-arch image
    needs: [verify, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  offline:
    name: Offline ZIP + checksum
    needs: [verify, validate]
    runs-on: ubuntu-latest
    env:
      ZIP: ${{ github.event.repository.name }}-${{ github.ref_name }}-offline.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:offline
      - name: Package
        run: |
          mkdir -p out
          (cd dist/offline && zip -rX9 "../../out/$ZIP" .)
          (cd out && sha256sum "$ZIP" > "$ZIP.sha256" && cat "$ZIP.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: out/
          retention-days: 7

  release:
    name: GitHub Release
    needs: [verify, docker, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: out
      - name: Create or update release (idempotent on rerun)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing assets"
            gh release upload "$TAG" out/* --clobber
          else
            flags=(--generate-notes --verify-tag --title "$TAG")
            [ "$PRE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" out/* "${flags[@]}"
          fi
